# T00-07 – CI. Mã nằm trong app/ theo yêu cầu dự án; để GitHub chạy, chép file này vào .github/workflows/ ở gốc repo.
name: ci
on: [push, pull_request]
defaults:
  run:
    working-directory: app
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r backend/requirements.txt
      - working-directory: app/backend
        run: |
          ruff check app worker devidp tests
          mypy
          lint-imports
          pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: app/frontend
        run: |
          npm ci
          npx tsc -p .
          npx vite build
